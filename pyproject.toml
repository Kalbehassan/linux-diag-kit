[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-diag-kit"
version = "0.1.0"
description = "Python + Linux automation, command execution, and log diagnostics toolkit"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
linux-diag = "linux_diag_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
